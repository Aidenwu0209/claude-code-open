<svg width="1440" height="760" viewBox="0 0 1440 760" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1440" height="760" rx="34" fill="#132A38"/>
  <text x="92" y="106" fill="#FFF8EF" font-family="Arial, Helvetica, sans-serif" font-size="58" font-weight="800">Launch Path</text>
  <text x="92" y="150" fill="#E8C99B" font-family="Arial, Helvetica, sans-serif" font-size="24">A simple order for getting the repository running cleanly and publishing it well.</text>

  <path d="M172 402H1268" stroke="#E6B779" stroke-width="8" stroke-linecap="round" stroke-dasharray="18 16"/>

  <g>
    <circle cx="224" cy="402" r="44" fill="#E07F49"/>
    <rect x="108" y="204" width="232" height="148" rx="24" fill="#FFF8EE"/>
    <text x="142" y="258" fill="#162B39" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="800">1. Install</text>
    <text x="142" y="300" fill="#496271" font-family="Arial, Helvetica, sans-serif" font-size="21">set up Bun, install deps,</text>
    <text x="142" y="330" fill="#496271" font-family="Arial, Helvetica, sans-serif" font-size="21">and verify the entrypoints</text>
  </g>

  <g>
    <circle cx="520" cy="402" r="44" fill="#E07F49"/>
    <rect x="404" y="452" width="232" height="148" rx="24" fill="#FFF8EE"/>
    <text x="438" y="506" fill="#162B39" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="800">2. Configure</text>
    <text x="438" y="548" fill="#496271" font-family="Arial, Helvetica, sans-serif" font-size="21">prepare env settings,</text>
    <text x="438" y="578" fill="#496271" font-family="Arial, Helvetica, sans-serif" font-size="21">settings, and defaults</text>
  </g>

  <g>
    <circle cx="816" cy="402" r="44" fill="#E07F49"/>
    <rect x="700" y="204" width="232" height="148" rx="24" fill="#FFF8EE"/>
    <text x="734" y="258" fill="#162B39" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="800">3. Run</text>
    <text x="734" y="300" fill="#496271" font-family="Arial, Helvetica, sans-serif" font-size="21">test the main CLI, local</text>
    <text x="734" y="330" fill="#496271" font-family="Arial, Helvetica, sans-serif" font-size="21">launcher, and recovery mode</text>
  </g>

  <g>
    <circle cx="1112" cy="402" r="44" fill="#E07F49"/>
    <rect x="996" y="452" width="232" height="148" rx="24" fill="#FFF8EE"/>
    <text x="1030" y="506" fill="#162B39" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="800">4. Polish</text>
    <text x="1030" y="548" fill="#496271" font-family="Arial, Helvetica, sans-serif" font-size="21">improve README, visuals,</text>
    <text x="1030" y="578" fill="#496271" font-family="Arial, Helvetica, sans-serif" font-size="21">tests, and public presentation</text>
  </g>
</svg>
