<svg width="1400" height="760" viewBox="0 0 1400 760" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1400" height="760" rx="32" fill="#132734"/>
  <text x="90" y="100" fill="#FFF8ED" font-family="Arial, Helvetica, sans-serif" font-size="54" font-weight="800">Next Steps</text>
  <text x="90" y="144" fill="#E8C999" font-family="Arial, Helvetica, sans-serif" font-size="24">Recommended order for stabilizing the merged repository</text>

  <path d="M160 410H1240" stroke="#F0C27A" stroke-width="8" stroke-linecap="round" stroke-dasharray="16 16"/>

  <g>
    <circle cx="220" cy="410" r="48" fill="#F0C27A"/>
    <rect x="110" y="200" width="220" height="150" rx="24" fill="#FFF6E7"/>
    <text x="146" y="255" fill="#152B39" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="800">1. Install</text>
    <text x="146" y="297" fill="#45606E" font-family="Arial, Helvetica, sans-serif" font-size="20">resolve bun deps</text>
    <text x="146" y="327" fill="#45606E" font-family="Arial, Helvetica, sans-serif" font-size="20">and verify entrypoints</text>
  </g>

  <g>
    <circle cx="520" cy="410" r="48" fill="#F0C27A"/>
    <rect x="410" y="470" width="220" height="150" rx="24" fill="#FFF6E7"/>
    <text x="446" y="525" fill="#152B39" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="800">2. Smoke Test</text>
    <text x="446" y="567" fill="#45606E" font-family="Arial, Helvetica, sans-serif" font-size="20">test full CLI and</text>
    <text x="446" y="597" fill="#45606E" font-family="Arial, Helvetica, sans-serif" font-size="20">recovery mode</text>
  </g>

  <g>
    <circle cx="820" cy="410" r="48" fill="#F0C27A"/>
    <rect x="710" y="200" width="220" height="150" rx="24" fill="#FFF6E7"/>
    <text x="746" y="255" fill="#152B39" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="800">3. Trim</text>
    <text x="746" y="297" fill="#45606E" font-family="Arial, Helvetica, sans-serif" font-size="20">remove parts you</text>
    <text x="746" y="327" fill="#45606E" font-family="Arial, Helvetica, sans-serif" font-size="20">do not want to keep</text>
  </g>

  <g>
    <circle cx="1120" cy="410" r="48" fill="#F0C27A"/>
    <rect x="1010" y="470" width="220" height="150" rx="24" fill="#FFF6E7"/>
    <text x="1046" y="525" fill="#152B39" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="800">4. Publish</text>
    <text x="1046" y="567" fill="#45606E" font-family="Arial, Helvetica, sans-serif" font-size="20">commit, push, and</text>
    <text x="1046" y="597" fill="#45606E" font-family="Arial, Helvetica, sans-serif" font-size="20">open your GitHub repo</text>
  </g>
</svg>
