<svg width="1440" height="980" viewBox="0 0 1440 980" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="1440" y2="980" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFF8EE"/>
      <stop offset="1" stop-color="#F1E2CC"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#1E4F66"/>
      <stop offset="1" stop-color="#102733"/>
    </linearGradient>
  </defs>

  <rect width="1440" height="980" rx="34" fill="url(#page)"/>
  <text x="92" y="104" fill="#122A38" font-family="Arial, Helvetica, sans-serif" font-size="58" font-weight="800">Open Stack</text>
  <text x="92" y="148" fill="#4D6675" font-family="Arial, Helvetica, sans-serif" font-size="24">How the repository is organized after the merge and cleanup work.</text>

  <rect x="92" y="210" width="1256" height="160" rx="28" fill="url(#accent)"/>
  <text x="132" y="274" fill="#FFF8EF" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="800">1. Entry + Session Layer</text>
  <rect x="132" y="296" width="170" height="34" rx="17" fill="#2C5F75"/>
  <text x="169" y="319" fill="#FFF8EF" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">bun run dev</text>
  <rect x="316" y="296" width="178" height="34" rx="17" fill="#D97D47"/>
  <text x="351" y="319" fill="#FFF8EF" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">bun run start</text>
  <rect x="508" y="296" width="206" height="34" rx="17" fill="#2C5F75"/>
  <text x="542" y="319" fill="#FFF8EF" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">./bin/claude-local</text>
  <rect x="1068" y="250" width="220" height="80" rx="22" fill="#D97D47"/>
  <text x="1114" y="300" fill="#FFF8EF" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700">CLI / TUI</text>

  <rect x="92" y="406" width="606" height="220" rx="28" fill="#FFFDF8" stroke="#D8B789" stroke-width="3"/>
  <text x="132" y="470" fill="#122A38" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="800">2. Tool + Permission Layer</text>
  <text x="132" y="520" fill="#4D6675" font-family="Arial, Helvetica, sans-serif" font-size="22">file tools, shell tools, web tools, agent tools,</text>
  <text x="132" y="554" fill="#4D6675" font-family="Arial, Helvetica, sans-serif" font-size="22">permission gates, sandbox flow, and render loop</text>
  <rect x="132" y="580" width="152" height="32" rx="16" fill="#E9F1F2"/>
  <text x="165" y="602" fill="#1C4E64" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">TOOLS</text>
  <rect x="300" y="580" width="182" height="32" rx="16" fill="#F7E4CF"/>
  <text x="334" y="602" fill="#A3521E" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">PERMISSIONS</text>
  <rect x="498" y="580" width="144" height="32" rx="16" fill="#E9F1F2"/>
  <text x="532" y="602" fill="#1C4E64" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">SANDBOX</text>

  <rect x="742" y="406" width="606" height="220" rx="28" fill="#FFFDF8" stroke="#D8B789" stroke-width="3"/>
  <text x="782" y="470" fill="#122A38" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="800">3. Integration Layer</text>
  <text x="782" y="520" fill="#4D6675" font-family="Arial, Helvetica, sans-serif" font-size="22">MCP, plugins, skills, OAuth, analytics, bridge,</text>
  <text x="782" y="554" fill="#4D6675" font-family="Arial, Helvetica, sans-serif" font-size="22">remote sessions, and provider integrations</text>
  <rect x="782" y="580" width="134" height="32" rx="16" fill="#E9F1F2"/>
  <text x="819" y="602" fill="#1C4E64" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">MCP</text>
  <rect x="932" y="580" width="146" height="32" rx="16" fill="#F7E4CF"/>
  <text x="963" y="602" fill="#A3521E" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">PLUGINS</text>
  <rect x="1094" y="580" width="130" height="32" rx="16" fill="#E9F1F2"/>
  <text x="1127" y="602" fill="#1C4E64" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">SKILLS</text>

  <rect x="92" y="662" width="1256" height="206" rx="28" fill="#132A38"/>
  <text x="132" y="726" fill="#FFF8EF" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="800">4. Public-facing Layer</text>
  <text x="132" y="774" fill="#F1D8AF" font-family="Arial, Helvetica, sans-serif" font-size="23">README, preview assets, docs pages, runtime references, and a repository layout that is easier to publish.</text>

  <rect x="132" y="806" width="186" height="34" rx="17" fill="#D97D47"/>
  <text x="183" y="829" fill="#FFF8EF" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">README</text>
  <rect x="336" y="806" width="222" height="34" rx="17" fill="#295E72"/>
  <text x="387" y="829" fill="#FFF8EF" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">IMAGE ASSETS</text>
  <rect x="576" y="806" width="180" height="34" rx="17" fill="#D97D47"/>
  <text x="625" y="829" fill="#FFF8EF" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">DOCS</text>
  <rect x="774" y="806" width="266" height="34" rx="17" fill="#295E72"/>
  <text x="844" y="829" fill="#FFF8EF" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">RUNTIME REFERENCES</text>
</svg>
