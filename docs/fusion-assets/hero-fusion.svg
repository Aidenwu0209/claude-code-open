  <text x="128" y="780" fill="#F2D7AD" font-family="Arial, Helvetica, sans-serif" font-size="22">• CLI, TUI, local launcher, and recovery mode</text>
  <text x="128" y="808" fill="#F2D7AD" font-family="Arial, Helvetica, sans-serif" font-size="22">• tools, permissions, plugins, skills, and docs</text>

