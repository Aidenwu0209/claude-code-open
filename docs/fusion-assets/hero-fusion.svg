  <text x="128" y="768" fill="#F2D7AD" font-family="Arial, Helvetica, sans-serif" font-size="22">• CLI / TUI / recovery startup paths</text>
  <text x="128" y="804" fill="#F2D7AD" font-family="Arial, Helvetica, sans-serif" font-size="22">• MCP, plugins, skills, permissions, and docs</text>

