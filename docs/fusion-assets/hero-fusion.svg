  <text x="88" y="274" fill="#122B39" font-family="Arial, Helvetica, sans-serif" font-size="102" font-weight="800">Claude</text>
  <text x="88" y="368" fill="#122B39" font-family="Arial, Helvetica, sans-serif" font-size="102" font-weight="800">Code Open</text>

