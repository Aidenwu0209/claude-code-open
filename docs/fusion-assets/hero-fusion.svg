  <text x="92" y="522" fill="#214255" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="500">Keep startup paths, docs,</text>
  <text x="92" y="562" fill="#214255" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="500">and public visuals together.</text>

