<svg width="1440" height="900" viewBox="0 0 1440 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1440" y2="900" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFF8EF"/>
      <stop offset="1" stop-color="#F1E1CB"/>
    </linearGradient>
    <linearGradient id="dark" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#1C4054"/>
      <stop offset="1" stop-color="#102633"/>
    </linearGradient>
  </defs>

  <rect width="1440" height="900" rx="34" fill="url(#bg)"/>
  <text x="92" y="108" fill="#122A38" font-family="Arial, Helvetica, sans-serif" font-size="58" font-weight="800">Open Stack</text>
  <text x="92" y="152" fill="#4D6675" font-family="Arial, Helvetica, sans-serif" font-size="24">A cleaner layer map with shorter lines and much larger text safety margins.</text>

  <g transform="translate(92 212)">
    <g transform="translate(0 0)">
      <rect width="1256" height="126" rx="28" fill="url(#dark)"/>
      <circle cx="52" cy="63" r="28" fill="#D97D47"/>
      <text x="40" y="73" fill="#FFF8EF" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="800">1</text>
      <text x="102" y="60" fill="#FFF8EF" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="800">Entry + Session</text>
      <text x="102" y="96" fill="#F2D4A8" font-family="Arial, Helvetica, sans-serif" font-size="23">Main CLI, interactive UI, and local launcher.</text>
      <rect x="1000" y="34" width="196" height="58" rx="22" fill="#D97D47"/>
      <text x="1048" y="71" fill="#FFF8EF" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700">CLI / TUI</text>
    </g>

    <g transform="translate(0 150)">
      <rect width="1256" height="126" rx="28" fill="#FFFDF9" stroke="#D7B788" stroke-width="3"/>
      <circle cx="52" cy="63" r="28" fill="#2D6278"/>
      <text x="40" y="73" fill="#FFF8EF" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="800">2</text>
      <text x="102" y="60" fill="#122A38" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="800">Tools + Permissions</text>
      <text x="102" y="96" fill="#4D6675" font-family="Arial, Helvetica, sans-serif" font-size="23">Commands, tools, sandbox, and approval flow.</text>
      <rect x="928" y="40" width="126" height="42" rx="16" fill="#EDF3F4"/>
      <text x="964" y="68" fill="#1D4F65" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">TOOLS</text>
      <rect x="1070" y="40" width="154" height="42" rx="16" fill="#F7E4CF"/>
      <text x="1102" y="68" fill="#A3521E" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">PERMISSIONS</text>
    </g>

    <g transform="translate(0 300)">
      <rect width="1256" height="126" rx="28" fill="#FFFDF9" stroke="#D7B788" stroke-width="3"/>
      <circle cx="52" cy="63" r="28" fill="#2D6278"/>
      <text x="40" y="73" fill="#FFF8EF" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="800">3</text>
      <text x="102" y="60" fill="#122A38" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="800">Integrations</text>
      <text x="102" y="96" fill="#4D6675" font-family="Arial, Helvetica, sans-serif" font-size="23">MCP, plugins, skills, providers, and runtime bridges.</text>
      <rect x="950" y="40" width="108" height="42" rx="16" fill="#EDF3F4"/>
      <text x="986" y="68" fill="#1D4F65" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">MCP</text>
      <rect x="1074" y="40" width="126" height="42" rx="16" fill="#F7E4CF"/>
      <text x="1102" y="68" fill="#A3521E" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">PLUGINS</text>
    </g>

    <g transform="translate(0 450)">
      <rect width="1256" height="150" rx="28" fill="url(#dark)"/>
      <circle cx="52" cy="75" r="28" fill="#D97D47"/>
      <text x="40" y="85" fill="#FFF8EF" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="800">4</text>
      <text x="102" y="72" fill="#FFF8EF" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="800">Public-facing Layer</text>
      <text x="102" y="112" fill="#F2D4A8" font-family="Arial, Helvetica, sans-serif" font-size="23">README, assets, docs, screenshots, and publishable structure.</text>
      <rect x="102" y="126" width="148" height="18" rx="9" fill="#D97D47"/>
      <rect x="270" y="126" width="190" height="18" rx="9" fill="#2D6278"/>
      <rect x="480" y="126" width="126" height="18" rx="9" fill="#D97D47"/>
      <rect x="626" y="126" width="170" height="18" rx="9" fill="#2D6278"/>
    </g>
  </g>
</svg>
