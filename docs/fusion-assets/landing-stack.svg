<svg width="1440" height="980" viewBox="0 0 1440 980" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="1440" y2="980" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFF8EF"/>
      <stop offset="1" stop-color="#F1E1CB"/>
    </linearGradient>
    <linearGradient id="dark" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#1D4154"/>
      <stop offset="1" stop-color="#102633"/>
    </linearGradient>
  </defs>

  <rect width="1440" height="980" rx="34" fill="url(#page)"/>
  <text x="92" y="108" fill="#122A38" font-family="Arial, Helvetica, sans-serif" font-size="58" font-weight="800">Open Stack</text>
  <text x="92" y="152" fill="#4D6675" font-family="Arial, Helvetica, sans-serif" font-size="24">A simplified map of the repository layout after the merge and cleanup work.</text>

  <g transform="translate(92 214)">
    <g transform="translate(0 0)">
      <rect width="1256" height="132" rx="28" fill="url(#dark)"/>
      <circle cx="54" cy="66" r="28" fill="#D97D47"/>
      <text x="43" y="76" fill="#FFF8EF" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="800">1</text>
      <text x="104" y="62" fill="#FFF8EF" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="800">Entry + Session Layer</text>
      <text x="104" y="98" fill="#F2D4A8" font-family="Arial, Helvetica, sans-serif" font-size="23">bun run dev, bun run start, and the local launcher all land here.</text>
      <rect x="942" y="34" width="240" height="64" rx="22" fill="#D97D47"/>
      <text x="1002" y="75" fill="#FFF8EF" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700">CLI / TUI</text>
    </g>

    <g transform="translate(0 160)">
      <rect width="1256" height="132" rx="28" fill="#FFFDF9" stroke="#D7B788" stroke-width="3"/>
      <circle cx="54" cy="66" r="28" fill="#2D6278"/>
      <text x="43" y="76" fill="#FFF8EF" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="800">2</text>
      <text x="104" y="62" fill="#122A38" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="800">Tools + Permissions</text>
      <text x="104" y="98" fill="#4D6675" font-family="Arial, Helvetica, sans-serif" font-size="23">commands, file tools, shell tools, permission gates, and sandbox behavior.</text>
      <rect x="874" y="42" width="128" height="46" rx="18" fill="#EDF3F4"/>
      <text x="912" y="72" fill="#1D4F65" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">TOOLS</text>
      <rect x="1020" y="42" width="172" height="46" rx="18" fill="#F7E4CF"/>
      <text x="1058" y="72" fill="#A3521E" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">PERMISSIONS</text>
    </g>

    <g transform="translate(0 320)">
      <rect width="1256" height="132" rx="28" fill="#FFFDF9" stroke="#D7B788" stroke-width="3"/>
      <circle cx="54" cy="66" r="28" fill="#2D6278"/>
      <text x="43" y="76" fill="#FFF8EF" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="800">3</text>
      <text x="104" y="62" fill="#122A38" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="800">Integrations + Runtime</text>
      <text x="104" y="98" fill="#4D6675" font-family="Arial, Helvetica, sans-serif" font-size="23">MCP, plugins, skills, providers, remote sessions, and bridge services.</text>
      <rect x="860" y="42" width="114" height="46" rx="18" fill="#EDF3F4"/>
      <text x="898" y="72" fill="#1D4F65" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">MCP</text>
      <rect x="992" y="42" width="128" height="46" rx="18" fill="#F7E4CF"/>
      <text x="1023" y="72" fill="#A3521E" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">PLUGINS</text>
      <rect x="1138" y="42" width="96" height="46" rx="18" fill="#EDF3F4"/>
      <text x="1159" y="72" fill="#1D4F65" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">SKILLS</text>
    </g>

    <g transform="translate(0 480)">
      <rect width="1256" height="160" rx="28" fill="url(#dark)"/>
      <circle cx="54" cy="80" r="28" fill="#D97D47"/>
      <text x="43" y="90" fill="#FFF8EF" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="800">4</text>
      <text x="104" y="74" fill="#FFF8EF" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="800">Public-facing Layer</text>
      <text x="104" y="112" fill="#F2D4A8" font-family="Arial, Helvetica, sans-serif" font-size="23">README, preview assets, docs pages, screenshots, and a layout that is easier to publish.</text>
      <rect x="104" y="124" width="156" height="24" rx="12" fill="#D97D47"/>
      <rect x="280" y="124" width="196" height="24" rx="12" fill="#2D6278"/>
      <rect x="496" y="124" width="132" height="24" rx="12" fill="#D97D47"/>
      <rect x="648" y="124" width="228" height="24" rx="12" fill="#2D6278"/>
    </g>
  </g>
</svg>
