    <rect x="28" y="28" width="534" height="188" rx="28" fill="url(#card)"/>
    <rect x="58" y="62" width="96" height="96" rx="26" fill="#1F566D"/>
    <rect x="78" y="86" width="56" height="12" rx="6" fill="#FFF8EE"/>
