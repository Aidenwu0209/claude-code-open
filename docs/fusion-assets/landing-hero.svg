    <text x="184" y="174" fill="#4B6675" font-family="Arial, Helvetica, sans-serif" font-size="24">tools, print mode, and history</text>

    <rect x="28" y="244" width="252" height="182" rx="26" fill="url(#card)"/>
    <rect x="308" y="244" width="254" height="182" rx="26" fill="url(#card)"/>

