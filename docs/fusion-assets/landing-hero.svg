  </defs>

  <rect width="1600" height="900" rx="36" fill="url(#bg)"/>
  <circle cx="1328" cy="150" r="168" fill="#FFF9F2" fill-opacity="0.32"/>
  <circle cx="1428" cy="758" r="288" fill="#103246" fill-opacity="0.16"/>
  <circle cx="236" cy="760" r="210" fill="#FFF8EE" fill-opacity="0.22"/>

  <g opacity="0.16" stroke="#264B5E">
    <path d="M84 174H694"/>
    <path d="M84 226H694"/>
    <path d="M84 278H694"/>
    <path d="M84 330H694"/>
  </g>

  <rect x="90" y="88" width="432" height="54" rx="27" fill="#132C3A"/>
  <text x="120" y="123" fill="#FFF8EE" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">Local-first Claude Code workspace</text>

  <text x="90" y="274" fill="#122B39" font-family="Arial, Helvetica, sans-serif" font-size="104" font-weight="800">Claude</text>
  <text x="90" y="370" fill="#122B39" font-family="Arial, Helvetica, sans-serif" font-size="104" font-weight="800">Code Open</text>

  <text x="96" y="446" fill="#214457" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700">Run locally.</text>
  <text x="96" y="490" fill="#214457" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700">Inspect the codebase.</text>
  <text x="96" y="534" fill="#214457" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700">Keep docs, tools, and launch paths together.</text>

  <rect x="90" y="624" width="664" height="184" rx="30" fill="url(#deep)"/>
  <text x="132" y="686" fill="#FFF8EE" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="800">What this repository includes</text>
  <text x="132" y="732" fill="#F2D6AD" font-family="Arial, Helvetica, sans-serif" font-size="22">• Bun + TypeScript workspace for local development</text>
  <text x="132" y="768" fill="#F2D6AD" font-family="Arial, Helvetica, sans-serif" font-size="22">• CLI, TUI, local launcher, and recovery mode</text>
  <text x="132" y="804" fill="#F2D6AD" font-family="Arial, Helvetica, sans-serif" font-size="22">• tools, permissions, docs, and public assets</text>

