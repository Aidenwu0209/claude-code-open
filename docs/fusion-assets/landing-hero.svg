    <path d="M76 314H106" stroke="#FFF8EE" stroke-width="8" stroke-linecap="round"/>
    <path d="M91 299V329" stroke="#FFF8EE" stroke-width="8" stroke-linecap="round"/>
    <text x="146" y="304" fill="#143042" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="800">Local launcher</text>
    <text x="146" y="340" fill="#4B6675" font-family="Arial, Helvetica, sans-serif" font-size="20">extra entrypoint</text>
    <text x="146" y="370" fill="#4B6675" font-family="Arial, Helvetica, sans-serif" font-size="20">for local starts</text>

