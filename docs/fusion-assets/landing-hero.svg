    <text x="426" y="340" fill="#4B6675" font-family="Arial, Helvetica, sans-serif" font-size="20">fallback mode</text>
    <text x="426" y="370" fill="#4B6675" font-family="Arial, Helvetica, sans-serif" font-size="20">for debugging</text>

    <rect x="28" y="456" width="534" height="194" rx="28" fill="url(#deep)"/>
    <text x="64" y="518" fill="#FFF8EE" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="800">Built to keep moving</text>
    <rect x="388" y="486" width="114" height="42" rx="21" fill="#D97D47"/>
    <text x="423" y="513" fill="#FFF8EE" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700">Bun</text>
    <rect x="388" y="540" width="144" height="42" rx="21" fill="#2D6278"/>
    <text x="407" y="567" fill="#FFF8EE" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700">TypeScript</text>

    <text x="64" y="572" fill="#F1D4A8" font-family="Arial, Helvetica, sans-serif" font-size="22">• open the CLI quickly</text>
    <text x="64" y="606" fill="#F1D4A8" font-family="Arial, Helvetica, sans-serif" font-size="22">• read the docs in-repo</text>
    <text x="64" y="640" fill="#F1D4A8" font-family="Arial, Helvetica, sans-serif" font-size="22">• keep tools and assets together</text>
